<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUD & ORO | Place Your Order</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5eee2;font-family:Arial,sans-serif;padding:25px}
main{max-width:600px;margin:30px auto;background:#1d1b19;padding:25px;border:1px solid #b99862;border-radius:14px}
h1{color:#c9a66b;text-align:center}
label{display:block;margin-top:14px}
input,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #9b835f;border-radius:6px;background:#111;color:white}
button{width:100%;padding:14px;margin-top:20px;background:#c9a66b;color:#111;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
#summary{background:#111;padding:14px;border-radius:8px;line-height:1.8}
 /* FORCE ROUND QUANTITY BUTTONS */
.quantity-control button,
.quantity-buttons button,
#minusBtn,
#plusBtn,
#minusbtn,
#plusbtn {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 58px !important;
  height: 58px !important;
  min-width: 58px !important;
  padding: 0 !important;
  margin: 0 !important;
  border-radius: 50% !important;
  border: none !important;
  background: #c9a66b !important;
  color: #101010 !important;
  font-size: 32px !important;
  font-weight: bold !important;
  cursor: pointer !important;
}

.quantity-control,
.quantity-buttons {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 25px !important;
  width: 100% !important;
}

#quantity {
  font-size: 25px !important;
  font-weight: bold !important;
  min-width: 35px !important;
  text-align: center !important;
}
 .price-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 22px 0;
}

.price-box label {
  display: block;
  margin-top: 10px;
  font-size: 18px;
  font-weight: 700;
  color: #f5eee2;
}

.price-box input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border: 1px solid #c9a66b;
  border-radius: 8px;
  background: #191725;
  color: #ffffff;
  font-size: 19px;
  font-weight: 700;
</style>
</head>
<body>
<main>
<h1>OUD & ORO</h1>
<h2>Your Order Details</h2>
<div id="summary">Loading your selected perfume...</div>
  <div class="quantity-control">
    <button type="button"
 id="minusBtn">-</button>
    <span id="quantity">1</span>
    <button type="button"
 id="plusBtn">+</button>
  </div>
</div>
<div class="price-box">
    <label for="unitPrice">price perfume</label>
  <input id="unitPrice" type="text" value="Rs. 2;499" readonly>
  <label for="totalAmount">Total Amount</label>
  <input id="totalAmount" type="text" value="Rs. 2,499" readonly>
</div>
<form id="orderForm">
<label>First Name *</label>
<input name="first" required>
<label>Last Name</label>
<input name="last">
<label>Phone Number *</label>
<input name="phone" type="tel" required>
<label>Email Address</label>
<input name="email" type="email">
<label>Complete Delivery Address *</label>
<textarea name="address" rows="3" required></textarea>
<button type="submit">Place Order on WhatsApp</button>
</form>
</main>
<script>
  const params = new URLSearchParams(location.search);

const products = [
  {name:"Oud Royale",price:2499},
  {name:"Velvet Bloom",price:1999},
  {name:"Noir Intense",price:2799},
  {name:"Rose Essence",price:1799}
];

const index = Number(params.get("product"));
const product = products[index];
let qty = Math.max(1, Number(params.get("qty")) || 1);

const summary = document.getElementById("summary");
const quantity = document.getElementById("quantity");
const unitPrice = document.getElementById("unitPrice");
const totalAmount = document.getElementById("totalAmount");
const plusBtn = document.getElementById("plusBtn");
const minusBtn = document.getElementById("minusBtn");

function updateOrder() {
  if (!product) {
    summary.textContent = "Perfume not found. Return to the store.";
    unitPrice.value = "Rs. 0";
    totalAmount.value = "Rs. 0";
    return;
  }

  quantity.textContent = qty;
  unitPrice.value =
   "Rs. " + product.price.toLocaleString("en-PK");
  totalAmount.value =
   "Rs. " + (product.price * qty).toLocaleString("en-PK");
  summary.textContent =
    product.name + " × " + qty + " — Rs. " +
    (product.price * qty).toLocaleString("en-PK");
}

plusBtn.addEventListener("click", function () {
  qty++;
  updateOrder();
});

minusBtn.addEventListener("click", function () {
  if (qty > 1) {
    qty--;
    updateOrder();
  }
});
const orderform =
document.getElementById("orderForm")
;
if (orderform)
orderform.addEventListener("submit", function (e) {
  e.preventDefault();
  
  if (!product) {
    alert("Please select a perfume from the store.");
    return;
  }

  const f = new FormData(this);
  const message = [
    "NEW OUD & ORO ORDER",
    "Perfume: " + product.name,
    "Quantity: " + qty,
    "Price per perfume: Rs. " + product.price,
    "Total: Rs. " + (product.price * qty),
    "Payment: Cash on Delivery",
    "Name: " + f.get("first") + " " + f.get("last"),
    "Phone: " + f.get("phone"),
    "Email: " + (f.get("email") || "Not provided"),
    "Address: " + f.get("address")
  ].join("\n");

  window.open(
    "https://wa.me/923001234567?text=" + encodeURIComponent(message),
    "_blank"
  );
});

updateOrder();
</script>
</body>
</html>
